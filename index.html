<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Pulse + Dev Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Consolas, monospace; background: #0e0e1a; color: #eee;
    display: flex; flex-direction: column; align-items: center; padding: 16px; min-height: 100vh; }
  h1 { font-size: 20px; letter-spacing: 2px; color: #0ff; margin-bottom: 4px; }
  p.sub { font-size: 12px; color: #888; margin-bottom: 10px; }
  #wrap { width: min(920px, 100%); border: 2px solid #0ff; border-radius: 8px; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; cursor: pointer;
    touch-action: none; image-rendering: pixelated; background: #0e0e1a; }
  #hud { display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; font-size: 13px; background: #141428; border-top: 2px solid #0ff; }
  button { font-family: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer;
    border: 2px solid #0ff; border-radius: 5px; background: #0e0e1a; color: #0ff; }
  button:hover { background: #0ff; color: #000; }
  /* Dev panel */
  #dev { width: min(920px, 100%); margin-top: 10px; border: 2px solid #f0f;
    border-radius: 8px; background: #141428; padding: 12px 14px; }
  #dev h2 { font-size: 14px; color: #f0f; letter-spacing: 1px; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .row label { width: 150px; color: #aaa; }
  .row output { width: 64px; text-align: right; color: #0ff; }
  .row input[type=range] { flex: 1; accent-color: #f0f; }
  #calc { margin-top: 8px; font-size: 12px; color: #ff9; }
  #devBtns { margin-top: 8px; display: flex; gap: 8px; }
  #devBtns button { border-color: #f0f; color: #f0f; }
  #devBtns button:hover { background: #f0f; color: #000; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1 id="title">PIXEL PULSE</h1>
<p class="sub" id="sub">Space / &uarr; / κλικ / tap = άλμα (κράτα για ψηλότερα) &nbsp;•&nbsp; &darr; = σκύψιμο</p>
<div id="wrap"><canvas id="game" width="900" height="300"></canvas></div>
<div id="hudWrap" style="margin-top:10px;">
  <div id="hud">
    <span>Σκορ: <b id="score">0</b></span>
    <span>Κόμπο: <b id="combo">x1</b></span>
    <span>Ρεκόρ: <b id="hi">0</b></span>
    <button id="restartBtn">Ξανά (R)</button>
    <button id="musicBtn">Μουσική: OFF</button>
  </div>
</div>

<div id="dev">
  <h2>DEV PANEL — παράμετροι (αποθηκεύονται σαν default)</h2>
  <div class="grid">
    <div class="row"><label>Ταχύτητα</label><input id="sSpeed" type="range" min="4" max="16" step="0.5"><output id="oSpeed"></output></div>
    <div class="row"><label>Άλμα (vel)</label><input id="sJump" type="range" min="8" max="24" step="0.5"><output id="oJump"></output></div>
    <div class="row"><label>Βαρύτητα</label><input id="sGrav" type="range" min="0.5" max="2.5" step="0.05"><output id="oGrav"></output></div>
    <div class="row"><label>Κενό min (px)</label><input id="sGapMin" type="range" min="150" max="700" step="10"><output id="oGapMin"></output></div>
    <div class="row"><label>Κενό max (px)</label><input id="sGapMax" type="range" min="300" max="1100" step="10"><output id="oGapMax"></output></div>
  </div>
  <div id="calc"></div>
  <div id="devBtns">
    <button id="saveBtn">Αποθήκευση σαν default</button>
    <button id="resetBtn">Επαναφορά default</button>
  </div>
</div>

<script>
"use strict";

// ---------- Σταθερές ----------
const W = 900, H = 300, GY = 250;   // διαστάσεις + έδαφος
const HARD_DEF = { speed: 8, jumpV: 15, grav: 1.2, gapMin: 280, gapMax: 650 };
const LS_KEY = 'pixel_def', LS_HI = 'pixel_hi';

// ---------- Canvas ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const hiEl = document.getElementById('hi');

// ---------- Παράμετροι (live από sliders) ----------
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
let P = { ...HARD_DEF };
try {
  const saved = JSON.parse(lsGet(LS_KEY) || 'null');
  if (saved) { P = { ...HARD_DEF, ...saved }; }
} catch (e) {}
let hi = +(lsGet(LS_HI) || 0);
hiEl.textContent = hi;

// ---------- Ήχοι (procedural, χωρίς αρχεία) ----------
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') { AC.resume(); }
  return AC;
}
function beep(f0, f1, dur, type, vol) {
  const ac = audio();
  if (!ac) { return; }
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f0, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), ac.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}

// ---------- Κατάσταση ----------
let state, frame, score, nextIn, hero, obs, coins, pow, stars, mts;
let parts, floats, combo, comboT, shake, SPD;   // fx + κόμπο + ενεργή ταχύτητα
let blds, flash;   // πόλη + φλας θανάτου
// Προ-render: στατικά sprites σε offscreen canvas (1 drawImage/frame αντί για 100άδες fillRect)
function newBld(x) {
  const w = 40 + Math.random() * 70, h = 40 + Math.random() * 90;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(w); cv.height = Math.ceil(h);
  const g = cv.getContext('2d');
  g.fillStyle = '#120b2e';
  g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#ffd75e';
  for (let wy = 8; wy < h - 8; wy += 14) {
    for (let wx = 6; wx < w - 6; wx += 12) {
      if (((wx * 7 + wy * 13) | 0) % 5 < 2) { g.fillRect(wx, wy, 5, 7); }
    }
  }
  return { x: x, w: w, h: h, cv: cv };
}
let MTN = null;
function mtnTile() {
  if (MTN) { return MTN; }   // χτίζεται 1 φορά
  MTN = document.createElement('canvas');
  MTN.width = 550; MTN.height = GY;
  const g = MTN.getContext('2d');
  g.fillStyle = '#241145';
  g.beginPath();
  g.moveTo(0, GY); g.lineTo(150, 120); g.lineTo(300, GY);
  g.lineTo(400, 170); g.lineTo(550, GY);
  g.closePath(); g.fill();
  return MTN;
}
function reset() {
  state = 'ready'; frame = 0; score = 0;
  nextIn = 80; SPD = P.speed;
  combo = 0; comboT = 0; shake = 0;
  hero = { x: 70, y: GY, vy: 0, duck: false, dead: false, onGround: true, coy: 0, buf: 0, shield: 0, mag: 0, inv: 0 };
  obs = []; coins = []; pow = []; parts = []; floats = [];
  stars = [];
  for (let i = 0; i < 70; i++) { stars.push({ x: Math.random() * W, y: Math.random() * 200, s: Math.random() < 0.3 ? 2 : 1 }); }
  mts = [{ x: 0 }, { x: 450 }];
  blds = [];
  let bx = 0;
  while (bx < W * 2) { const b = newBld(bx); blds.push(b); bx += b.w + 10 + Math.random() * 40; }
  flash = 0;
  scoreEl.textContent = '0'; comboEl.textContent = 'x1';
}

// ---------- Spawn εμποδίων + νομισμάτων ----------
function spawn() {
  const r = Math.random();
  if (score > 400 && r < 0.18) {
    obs.push({ k: 'lowbar', x: W + 20, w: 70, h: 20 });   // ψηλή μπάρα: σκύψε (ή πήδα από πάνω)
  } else if (score > 250 && r < 0.32) {
    obs.push({ k: 'wall', x: W + 20, w: 30, h: 74 });     // ψηλός τοίχος: θέλει κρατημένο άλμα
  } else if (score > 120 && r < 0.45) {
    const ys = [GY - 6, GY - 34, GY - 60];   // χαμηλό = θέλει σκύψιμο
    const y = ys[(Math.random() * ys.length) | 0];
    obs.push({ k: 'drone', x: W + 20, y: y, w: 34, h: 22 });
  } else if (r < 0.7) {
    obs.push({ k: 'spike', x: W + 20, w: 26, h: 46 });
  } else {
    obs.push({ k: 'spike2', x: W + 20, w: 52, h: 40 });
  }
  // νομίσματα κλειδωμένα στο εμπόδιο (πάντα μαζεύσιμα)
  const o = obs[obs.length - 1];
  if (Math.random() < 0.5) {
    if (o.k === 'lowbar' || o.k === 'drone') {
      const bx = o.x + o.w + 50;   // χαμηλή σειρά στο κενό μετά
      for (let i = 0; i < 5; i++) { coins.push({ x: bx + i * 28, y: GY - 24, got: false }); }
    } else {
      const peak = Math.min(o.h + 30, 72);   // αψίδα πάνω από το εμπόδιο
      for (let i = 0; i < 6; i++) {
        coins.push({ x: o.x - 50 + i * 30, y: GY - 30 - Math.sin(i / 5 * Math.PI) * peak, got: false });
      }
    }
  } else {
    const bx = o.x + o.w + 60;   // σειρά τρεξίματος στο κενό
    for (let i = 0; i < 5; i++) { coins.push({ x: bx + i * 28, y: GY - 40, got: false }); }
  }
  if (score > 200 && Math.random() < 0.10) {   // σπάνιο power-up
    pow.push({ x: W + 120, y: GY - 120, k: Math.random() < 0.5 ? 'shield' : 'magnet', got: false });
  }
  const gap = P.gapMin + Math.random() * Math.max(50, P.gapMax - P.gapMin);
  nextIn = Math.ceil(gap / SPD);
}

// ---------- Σχεδίαση: φόντο (synthwave) ----------
let SKYCV = null;
function skyTile() {
  if (SKYCV) { return SKYCV; }   // ουρανός + ήλιος: στατικά, χτίζονται 1 φορά
  SKYCV = document.createElement('canvas');
  SKYCV.width = W; SKYCV.height = GY;
  const g = SKYCV.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, GY);
  grad.addColorStop(0, '#070313');
  grad.addColorStop(0.55, '#1b0f45');
  grad.addColorStop(0.85, '#4b135e');
  grad.addColorStop(1, '#93205e');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, GY);
  const sunX = W * 0.72, sunY = GY - 130;   // στατικός ήλιος (ο παλμός ±2px δεν φαίνεται)
  const sg = g.createRadialGradient(sunX, sunY, 10, sunX, sunY, 68);
  sg.addColorStop(0, '#ffe95e'); sg.addColorStop(0.6, '#ff9a3d'); sg.addColorStop(1, '#ff2e88');
  g.fillStyle = sg;
  g.beginPath(); g.arc(sunX, sunY, 66, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#1b0f45';
  for (let i = 0; i < 5; i++) { const yy = sunY + 8 + i * 11; g.fillRect(sunX - 68, yy, 136, 3 + i); }
  return SKYCV;
}
function drawBg() {
  ctx.drawImage(skyTile(), 0, 0);

  // αστέρια (twinkle)
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(frame * 0.05 + s.x * 0.1));
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // βουνά (1 prerendered tile)
  const mtn = mtnTile();
  for (const m of mts) { ctx.drawImage(mtn, m.x, 0); }

  // πόλη σιλουέτα + φωτισμένα παράθυρα (prerendered)
  for (const b of blds) { ctx.drawImage(b.cv, b.x, GY - b.h); }

  // έδαφος + neon γραμμή
  ctx.fillStyle = '#0d0a24';
  ctx.fillRect(0, GY, W, H - GY);
  // neon γραμμή: ψεύτικη λάμψη με 2 γεμίσματα (φτηνή, χωρίς blur)
  ctx.fillStyle = 'rgba(0,255,255,0.25)';
  ctx.fillRect(0, GY - 3, W, 9);
  ctx.fillStyle = '#0ff';
  ctx.fillRect(0, GY, W, 3);
  ctx.fillStyle = '#f0f';
  const off = (frame * SPD) % 40;
  for (let x = -off; x < W; x += 40) { ctx.fillRect(x, GY + 14, 20, 2); }
}

// ---------- Σχεδίαση: ήρωας (pixel) ----------
function drawHero() {
  const h = hero;
  if (h.inv > 0 && (frame >> 1) % 2 === 0) { ctx.globalAlpha = 0.35; }  // blink ασυλίας
  const run = h.onGround && state === 'play' ? (frame >> 3) % 2 : 0;
  const x = h.x;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';   // σκιά εδάφους
  ctx.fillRect(x - 2, GY + 4, h.duck ? 46 : 26, 4);

  if (h.duck) {
    const top = h.y - 24, w = 46;
    ctx.fillStyle = '#f43'; ctx.fillRect(x - 10, top + 8, 10, 5);   // φουλάρι
    ctx.fillStyle = '#fff'; ctx.fillRect(x, top + 4, w - 8, 14);   // σώμα
    ctx.fillStyle = '#111'; ctx.fillRect(x, top + 4, 4, 14);        // περίγραμμα
    ctx.fillStyle = '#f43'; ctx.fillRect(x + 2, top - 3, w - 12, 6); // καπέλο
    ctx.fillStyle = '#0ff'; ctx.fillRect(x + w - 20, top + 7, 12, 5); // visor
    ctx.fillStyle = '#fff';                                         // πόδια
    if (run === 0) { ctx.fillRect(x + 6, top + 18, 7, 7); ctx.fillRect(x + 26, top + 18, 7, 7); }
    else { ctx.fillRect(x + 12, top + 18, 7, 7); ctx.fillRect(x + 22, top + 18, 7, 7); }
    ctx.globalAlpha = 1;
    if (h.shield > 0 && state !== 'over') {
      ctx.fillStyle = 'rgba(0,255,255,0.8)';
      ctx.fillRect(x - 6, top - 6, 58, 2); ctx.fillRect(x - 6, top + 30, 58, 2);
      ctx.fillRect(x - 6, top - 6, 2, 36); ctx.fillRect(x + 52, top - 6, 2, 36);
    }
    return;
  }

  const top = h.y - 44;
  ctx.fillStyle = '#f43';                                          // φουλάρι (κυματίζει)
  ctx.fillRect(x - 12 - (run ? 4 : 0), top + 18, 12, 5);
  ctx.fillStyle = '#fff'; ctx.fillRect(x, top + 14, 22, 18);       // κορμός
  ctx.fillStyle = '#111'; ctx.fillRect(x, top + 14, 3, 18);        // περίγραμμα
  ctx.fillStyle = '#fff'; ctx.fillRect(x + 2, top, 20, 15);        // κεφάλι
  ctx.fillStyle = '#f43'; ctx.fillRect(x, top - 5, 24, 6);          // καπέλο
  ctx.fillRect(x + 20, top - 2, 7, 3);                             // γείσο
  ctx.fillStyle = '#0ff'; ctx.fillRect(x + 10, top + 5, 11, 5);    // visor
  ctx.fillStyle = '#fff';                                         // πόδια
  if (!h.onGround) { ctx.fillRect(x + 3, top + 32, 7, 12); ctx.fillRect(x + 13, top + 32, 7, 8); }
  else if (state === 'play') {
    if (run === 0) { ctx.fillRect(x + 3, top + 32, 7, 12); ctx.fillRect(x + 13, top + 32, 7, 12); }
    else { ctx.fillRect(x + 3, top + 32, 7, 8); ctx.fillRect(x + 13, top + 32, 7, 12); }
  } else { ctx.fillRect(x + 3, top + 32, 7, 12); ctx.fillRect(x + 13, top + 32, 7, 12); }

  if (h.dead) {                                                   // X μάτι
    ctx.strokeStyle = '#f00'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 12, top + 4); ctx.lineTo(x + 19, top + 11);
    ctx.moveTo(x + 19, top + 4); ctx.lineTo(x + 12, top + 11);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (h.shield > 0 && state !== 'over') {   // δαχτυλίδι ασπίδας
    ctx.fillStyle = 'rgba(0,255,255,0.8)';
    const shx = x - 6, shy = h.duck ? h.y - 30 : h.y - 50;
    const shw = h.duck ? 58 : 42, shh = h.duck ? 36 : 56;
    ctx.fillRect(shx, shy, shw, 2); ctx.fillRect(shx, shy + shh, shw, 2);
    ctx.fillRect(shx, shy, 2, shh); ctx.fillRect(shx + shw, shy, 2, shh);
  }
}

// ---------- Σχεδίαση: εμπόδια (pixel κρύσταλλοι) ----------
function drawObs(o) {
  if (o.k === 'drone') {
    ctx.fillStyle = '#ff0'; ctx.fillRect(o.x, o.y - 14, o.w, 16);
    ctx.fillStyle = '#111'; ctx.fillRect(o.x, o.y - 14, o.w, 3); ctx.fillRect(o.x, o.y - 1, o.w, 3);
    const blink = (frame >> 4) % 4;   // μάτι που ανοιγοκλείνει
    ctx.fillStyle = blink === 3 ? '#600' : '#f00';
    ctx.fillRect(o.x + 4, o.y - 10, 6, 6);
    const b = (frame >> 2) % 2;                                    // έλικας
    ctx.fillStyle = '#fff';
    if (b === 0) { ctx.fillRect(o.x - 4, o.y - 18, o.w + 8, 3); }
    else { ctx.fillRect(o.x + o.w / 2 - 2, o.y - 22, 4, 8); }
    return;
  }
  if (o.k === 'wall') {                                          // ψηλός τοίχος
    ctx.fillStyle = '#c33';
    ctx.fillRect(o.x, GY - o.h, o.w, o.h);
    ctx.fillStyle = '#f66';
    for (let yy = GY - o.h; yy < GY; yy += 12) { ctx.fillRect(o.x, yy, o.w, 3); }
    ctx.fillStyle = '#fff';
    ctx.fillRect(o.x + o.w / 2 - 2, GY - o.h, 4, 10);            // καρφί
    return;
  }
  if (o.k === 'lowbar') {                                        // ψηλή μπάρα
    const by = GY - 56;
    ctx.fillStyle = '#666';
    ctx.fillRect(o.x + 4, 0, 3, by); ctx.fillRect(o.x + o.w - 7, 0, 3, by); // αλυσίδες
    ctx.fillStyle = '#fb0';
    ctx.fillRect(o.x, by, o.w, 18);
    ctx.fillStyle = '#111';
    for (let xx = o.x; xx < o.x + o.w; xx += 14) { ctx.fillRect(xx, by, 7, 18); }
    return;
  }
  // κρύσταλλος: πυραμίδα από rects
  const baseY = GY, n = 5, step = o.h / n;
  for (let i = 0; i < n; i++) {
    const ww = o.w * (1 - i / n) + 4;
    const xx = o.x + (o.w - ww) / 2;
    ctx.fillStyle = '#f0f';
    ctx.fillRect(xx, baseY - (i + 1) * step, ww, step);
  }
  ctx.fillStyle = '#fff';                                          // πυρήνας
  ctx.fillRect(o.x + o.w / 2 - 2, baseY - o.h + 4, 4, o.h - 12);
  if (o.k === 'spike2') {                                          // 2ο κεφάλι δίπλα
    ctx.fillStyle = '#0ff';
    ctx.fillRect(o.x + o.w - 8, baseY - 22, 8, 22);
  }
}

// ---------- Σχεδίαση: power-ups ----------
function drawPow() {
  for (const u of pow) {
    if (u.got) { continue; }
    const s = 11 * (1 + Math.sin(frame * 0.1) * 0.12);   // παλμός
    if (u.k === 'shield') {
      ctx.fillStyle = '#0ff';
      ctx.fillRect(u.x - s, u.y - s, s * 2, 3); ctx.fillRect(u.x - s, u.y + s - 3, s * 2, 3);
      ctx.fillRect(u.x - s, u.y - s, 3, s * 2); ctx.fillRect(u.x + s - 3, u.y - s, 3, s * 2);
      ctx.fillStyle = '#fff';
      ctx.fillRect(u.x - 2, u.y - 5, 4, 10);
    } else {
      ctx.fillStyle = '#f00';
      ctx.fillRect(u.x - s, u.y - s, 6, s * 2); ctx.fillRect(u.x + s - 6, u.y - s, 6, s * 2);
      ctx.fillStyle = '#fff';
      ctx.fillRect(u.x - s, u.y + s - 6, 6, 6); ctx.fillRect(u.x + s - 6, u.y + s - 6, 6, 6);
    }
  }
}

// ---------- Σχεδίαση: νομίσματα + particles + κείμενα ----------
function drawCoins() {
  for (const c of coins) {
    if (c.got) { continue; }
    const wob = Math.abs(Math.sin((frame + c.x * 0.05) * 0.15)) * 6 + 4;  // spin
    ctx.fillStyle = 'rgba(252,192,0,0.35)';   // άλω
    ctx.fillRect(c.x - wob / 2 - 3, c.y - 9, wob + 6, 18);
    ctx.fillStyle = '#fc0';
    ctx.fillRect(c.x - wob / 2, c.y - 6, wob, 12);
    ctx.fillStyle = '#fff';
    ctx.fillRect(c.x - 1, c.y - 4, 2, 8);
  }
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function drawFloats() {
  ctx.textAlign = 'center'; ctx.font = 'bold 13px monospace';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, f.life / 50);
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}
function burst(x, y, n, colors, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.5 + Math.random()) * spd;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2,
      life: 20 + Math.random() * 20, size: 2 + Math.random() * 3,
      color: colors[(Math.random() * colors.length) | 0] });
  }
}

// ---------- Update ----------
function jump() {
  if (state === 'ready') { state = 'play'; }
  if (state === 'paused') { state = 'play'; return; }
  if (state === 'over') { return; }
  hero.buf = 6;   // buffer: εκτελείται στο update (coyote time)
}
function jumpCut() {
  if (state === 'play' && !hero.onGround && hero.vy < -4) { hero.vy *= 0.45; }  // κόψιμο άλματος
}
let dinged = false;
// ---------- Μουσική: loop sequencer (16 βήματα, Am) ----------
const MUS = { on: false, step: 0, next: 0, timer: null };
const BPM = 140, SPB = 60 / BPM / 4;   // 16th
const BASS = [55,0,55,55, 0,55,0,55, 43.65,0,43.65,43.65, 0,43.65,0,43.65,
  65.41,0,65.41,65.41, 0,65.41,0,65.41, 49,0,49,49, 0,49,73.42,0];
const LEAD = [440,0,523.25,0, 659.25,0,523.25,0, 440,0,349.23,0, 440,0,0,0,
  523.25,0,659.25,0, 783.99,0,659.25,523.25, 659.25,0,783.99,0, 880,783.99,659.25,0];
function note(f, t, d, type, vol) {
  const ac = audio();
  if (!ac || !f) { return; }
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + d);
}
function musTick() {
  const ac = audio();
  if (!ac) { return; }
  while (MUS.next < ac.currentTime + 0.15) {
    const s = MUS.step % 32, t = MUS.next;
    note(BASS[s], t, SPB * 1.8, 'square', 0.055);   // μπάσο
    note(LEAD[s], t, SPB * 1.5, 'square', 0.028);    // lead
    if (s % 4 === 0) { note(120, t, 0.12, 'sine', 0.13); }          // kick
    if (s % 16 === 4 || s % 16 === 12) { note(200, t, 0.09, 'square', 0.05); } // snare
    if (s % 2 === 0) { note(6000, t, 0.03, 'square', s % 4 === 2 ? 0.012 : 0.006); } // hat
    MUS.next += SPB;
    MUS.step++;
  }
}
function musToggle() {
  audio();
  if (!AC) { return; }   // no audio device: stay silent, game continues
  MUS.on = !MUS.on;
  document.getElementById('musicBtn').textContent = MUS.on ? 'Μουσική: ON' : 'Μουσική: OFF';
  if (MUS.on) { MUS.step = 0; MUS.next = AC.currentTime + 0.05; MUS.timer = setInterval(musTick, 30); }
  else { clearInterval(MUS.timer); MUS.timer = null; }
}
function update() {
  if (state === 'paused') { return; }   // παύση: πάγωμα φόντου
  frame++;
  SPD = P.speed + (state === 'play' ? Math.min(5, score * 0.005) : 0);  // ράμπα δυσκολίας
  for (const s of stars) { s.x -= SPD * 0.15; if (s.x < 0) { s.x = W; s.y = Math.random() * 200; } }
  for (const m of mts) { m.x -= SPD * 0.3; if (m.x < -550) { m.x = W; } }
  for (let i = 0; i < blds.length; i++) {
    const b = blds[i];
    b.x -= SPD * 0.5;
    if (b.x + b.w < 0) { blds[i] = newBld(W + Math.random() * 120); }
  }
  if (flash > 0) { flash--; }
  if (state !== 'play') { return; }

  score += 0.12;
  const s = Math.floor(score);
  scoreEl.textContent = s;
  if (s > 0 && s % 100 === 0) { if (!dinged) { beep(900, 1400, 0.09); dinged = true; } }
  else { dinged = false; }
  if (s > hi) { hi = s; hiEl.textContent = hi; lsSet(LS_HI, hi); }

  // combo timer
  if (comboT > 0) { comboT--; if (comboT === 0) { combo = 0; comboEl.textContent = 'x1'; } }

  const wasAir = !hero.onGround, fallV = hero.vy;
  if (hero.buf > 0) {   // buffered jump + coyote time
    hero.buf--;
    if (hero.onGround || hero.coy > 0) {
      hero.vy = -P.jumpV; hero.onGround = false; hero.coy = 0; hero.buf = 0; hero.duck = false;
      beep(300, 700, 0.12);
    }
  }
  hero.vy += P.grav;
  if (hero.duck && !hero.onGround) { hero.vy += 1.2; }
  hero.y += hero.vy;
  if (hero.y >= GY) {
    hero.y = GY; hero.vy = 0; hero.onGround = true; hero.coy = 6;
    if (wasAir && fallV > 6) { burst(hero.x + 15, GY, 8, ['#888', '#aaa'], 2); }  // σκόνη
  } else if (hero.coy > 0) { hero.coy--; }

  nextIn--;
  if (nextIn <= 0) { spawn(); }
  for (const o of obs) {
    o.x -= SPD;
    if (o.k === 'drone') { o.y += Math.sin(frame * 0.15 + o.x * 0.02) * 0.6; }
    if (!o.counted && o.x + o.w < hero.x) {   // πέρασμα = κόμπο
      o.counted = true; combo++; comboT = 240;
      const mult = Math.min(5, 1 + ((combo / 10) | 0));
      comboEl.textContent = 'x' + mult;
      let bonus = 5 * mult, txt = '+' + bonus, col = '#0ff';
      if (o.close) {   // κοντινό πέρασμα = έξτρα
        bonus += 15 * mult; txt = 'ΚΟΝΤΑ! +' + bonus; col = '#fc0';
        beep(1500, 2000, 0.08, 'square', 0.04);
      }
      score += bonus;
      floats.push({ x: hero.x + 40, y: hero.y - 60, txt: txt, life: 50, color: col });
    }
  }
  obs = obs.filter(o => o.x + o.w > -20);

  // νομίσματα
  const hx = hero.x + 15, hy = hero.y - 22;
  for (const c of coins) {
    c.x -= SPD;
    if (!c.got && Math.abs(c.x - hx) < 24 && Math.abs(c.y - hy) < 28) {
      c.got = true;
      const mult = Math.min(5, 1 + ((combo / 10) | 0)), v = 10 * mult;
      score += v; comboT = 240;
      burst(c.x, c.y, 10, ['#fc0', '#fff'], 2.5);
      floats.push({ x: c.x, y: c.y - 12, txt: '+' + v, life: 45, color: '#fc0' });
      beep(1200, 1800, 0.08, 'square', 0.04);
    }
  }
  coins = coins.filter(c => !c.got && c.x > -20);

  // power-ups
  for (const u of pow) {
    u.x -= SPD;
    u.y += Math.sin(frame * 0.08 + u.x * 0.03) * 0.5;
    if (!u.got && Math.abs(u.x - hx) < 26 && Math.abs(u.y - hy) < 32) {
      u.got = true;
      if (u.k === 'shield') { hero.shield = 1; floats.push({ x: u.x, y: u.y - 14, txt: 'ΑΣΠΙΔΑ', life: 60, color: '#0ff' }); }
      else { hero.mag = 600; floats.push({ x: u.x, y: u.y - 14, txt: 'ΜΑΓΝΗΤΗΣ', life: 60, color: '#f0f' }); }
      burst(u.x, u.y, 14, ['#0ff', '#fff'], 3);
      beep(600, 1200, 0.15, 'square', 0.05);
    }
  }
  pow = pow.filter(u => !u.got && u.x > -20);
  if (hero.mag > 0) {   // μαγνήτης τραβάει νομίσματα
    hero.mag--;
    for (const c of coins) {
      if (c.got) { continue; }
      const dx = hx - c.x, dy = hy - c.y, d = Math.hypot(dx, dy);
      if (d < 130 && d > 1) { c.x += dx / d * 6; c.y += dy / d * 6; }
    }
  }
  if (hero.inv > 0) { hero.inv--; }

  // particles + floats + shake
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 1; f.life--; }
  floats = floats.filter(f => f.life > 0);
  if (shake > 0) { shake *= 0.88; if (shake < 0.5) { shake = 0; } }
  if (state === 'play' && hero.onGround && frame % 8 === 0) {   // σκόνη τρεξίματος
    parts.push({ x: hero.x + 4, y: GY, vx: -1 - Math.random(), vy: -1 - Math.random(), life: 16, size: 2, color: '#8a7fd6' });
  }

  // hitbox (λίγο μικρότερο = fair)
  const hw = hero.duck ? 46 : 30, hh = hero.duck ? 24 : 44;
  const dx1 = hero.x + 4, dx2 = hero.x + hw - 4;
  const dy1 = hero.y - hh + 4, dy2 = hero.y - 2;
  for (const o of obs) {
    let ox1, ox2, oy1, oy2;
    if (o.k === 'drone') { ox1 = o.x + 3; ox2 = o.x + o.w - 3; oy1 = o.y - 14; oy2 = o.y + 2; }
    else if (o.k === 'lowbar') { ox1 = o.x + 3; ox2 = o.x + o.w - 3; oy1 = GY - 60; oy2 = GY - 36; }
    else { ox1 = o.x + 5; ox2 = o.x + o.w - 5; oy1 = GY - o.h + 6; oy2 = GY; }
    if (dx1 < ox2 && dx2 > ox1 && dy1 < oy2 && dy2 > oy1) {
      if (hero.inv > 0) { break; }
      if (hero.shield > 0) {   // η ασπίδα τρώει το χτύπημα
        hero.shield = 0; hero.inv = 90;
        burst(hero.x + 15, hero.y - 22, 25, ['#0ff', '#fff'], 4);
        floats.push({ x: hero.x + 40, y: hero.y - 60, txt: 'ΣΩΘΗΚΕΣ!', life: 60, color: '#0ff' });
        beep(500, 100, 0.25, 'sawtooth', 0.07);
        obs.splice(obs.indexOf(o), 1);
        break;
      }
      state = 'over'; hero.dead = true;
      combo = 0; comboEl.textContent = 'x1';
      shake = 14; flash = 14;
      burst(hero.x + 15, hero.y - 22, 45, ['#fff', '#f43', '#fc0'], 5);
      beep(400, 80, 0.3, 'sawtooth', 0.08);
      break;
    } else if (dx1 < ox2 && dx2 > ox1) {   // κοντινό πέρασμα;
      const gapV = dy1 >= oy2 ? dy1 - oy2 : oy1 - dy2;
      if (gapV > 0 && gapV < 16) { o.close = true; }
    }
  }
}

// ---------- Render ----------
function render() {
  ctx.save();
  if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); }
  drawBg();
  drawCoins();
  drawPow();
  for (const o of obs) { drawObs(o); }
  drawHero();
  drawParts();
  drawFloats();
  if (state === 'play' && SPD > 12) {   // γραμμές ταχύτητας
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    for (let i = 0; i < 4; i++) {
      const lx = W - ((frame * SPD * 2 + i * 263) % (W + 180)) + 90;
      ctx.fillRect(lx, (i * 67 + frame * 3) % 230 + 10, 80, 2);
    }
  }
  ctx.restore();
  if (flash > 0) {   // κόκκινο φλας θανάτου
    ctx.fillStyle = 'rgba(255,30,60,' + (flash * 0.02) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.textAlign = 'center';
  if (state === 'ready') {
    ctx.fillStyle = '#0ff'; ctx.font = 'bold 20px monospace';
    ctx.fillText('ΚΛΙΚ ΜΕΣΑ ΣΤΟ ΠΑΙΧΝΙΔΙ Ή SPACE ΓΙΑ ΝΑ ΞΕΚΙΝΗΣΕΙΣ', W / 2, 130);
    ctx.fillStyle = '#888'; ctx.font = '13px monospace';
    ctx.fillText('Space/↑/κλικ = άλμα (κρατημένο ψηλότερο) • ↓ σκύψιμο • P παύση • M μουσική', W / 2, 155);
  } else if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 160, 100, 320, 80);
    ctx.fillStyle = '#0ff'; ctx.font = 'bold 24px monospace';
    ctx.fillText('ΠΑΥΣΗ', W / 2, 132);
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText('P για συνέχεια', W / 2, 158);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 200, 90, 400, 95);
    ctx.fillStyle = '#f0f'; ctx.font = 'bold 24px monospace';
    ctx.fillText('GAME OVER', W / 2, 128);
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText('Σκορ ' + Math.floor(score) + ' — R ή κλικ για ξανά', W / 2, 158);
  }
  ctx.textAlign = 'right'; ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#666';
  ctx.fillText('HI ' + String(hi).padStart(5, '0') + '  ' + String(Math.floor(score)).padStart(5, '0') + (MUS.on ? '  ♪' : ''), W - 14, 26);
  ctx.textAlign = 'left';
}
function loop(t) {
  if (!loop.last) { loop.last = t; }
  loop.acc = Math.min(100, t - loop.last) / 16.667;   // σταθερό βήμα 60fps
  loop.last = t;
  let n = 0;
  while (loop.acc >= 1 && n < 5) { update(); loop.acc--; n++; }
  if (n === 5) { loop.acc = 0; }
  render();
  requestAnimationFrame(loop);
}
loop.acc = 0; loop.last = 0;

// ---------- Controls ----------
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); audio(); jump(); }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); if (state === 'play') { hero.duck = true; } }
  else if (e.code === 'KeyR') { reset(); state = 'play'; }
  else if (e.code === 'KeyM') { musToggle(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') {
    if (state === 'play') { state = 'paused'; }
    else if (state === 'paused') { state = 'play'; }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { hero.duck = false; }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { jumpCut(); }
});
canvas.addEventListener('pointerup', jumpCut);
canvas.addEventListener('pointerdown', () => {
  audio();
  if (state === 'over') { reset(); state = 'play'; }
  else { jump(); }
});
document.getElementById('restartBtn').addEventListener('click', () => { reset(); state = 'play'; });
document.getElementById('musicBtn').addEventListener('click', musToggle);
// itch iframe: πιάσε focus στο φόρτωμα, αλλιώς το πρώτο Space πάει στη σελίδα
try { canvas.tabIndex = 0; canvas.focus(); window.focus(); } catch (e) {}

// ---------- Dev panel wiring ----------
const S = {
  speed: document.getElementById('sSpeed'), jump: document.getElementById('sJump'),
  grav: document.getElementById('sGrav'), gapMin: document.getElementById('sGapMin'),
  gapMax: document.getElementById('sGapMax'),
};
const O = {
  speed: document.getElementById('oSpeed'), jump: document.getElementById('oJump'),
  grav: document.getElementById('oGrav'), gapMin: document.getElementById('oGapMin'),
  gapMax: document.getElementById('oGapMax'),
};
const calcEl = document.getElementById('calc');
function syncFromP() {
  S.speed.value = P.speed; S.jump.value = P.jumpV; S.grav.value = P.grav;
  S.gapMin.value = P.gapMin; S.gapMax.value = P.gapMax;
  syncLabels();
}
function syncLabels() {
  P.speed = +S.speed.value; P.jumpV = +S.jump.value; P.grav = +S.grav.value;
  P.gapMin = +S.gapMin.value; P.gapMax = +S.gapMax.value;
  if (P.gapMax < P.gapMin + 50) { P.gapMax = P.gapMin + 50; S.gapMax.value = P.gapMax; }
  O.speed.textContent = P.speed.toFixed(1);
  O.jump.textContent = P.jumpV.toFixed(1);
  O.grav.textContent = P.grav.toFixed(2);
  O.gapMin.textContent = P.gapMin; O.gapMax.textContent = P.gapMax;
  // Υπολογισμένα: ύψος + απόσταση άλματος
  const hPx = (P.jumpV * P.jumpV) / (2 * P.grav);
  const tFr = (2 * P.jumpV) / P.grav;
  const dPx = tFr * P.speed;
  calcEl.textContent = 'Υπολογ.: ύψος ≈ ' + Math.round(hPx) + 'px • χρόνος ≈ ' +
    (tFr / 60).toFixed(2) + 's • απόσταση ≈ ' + Math.round(dPx) + 'px';
}
for (const k of Object.keys(S)) { S[k].addEventListener('input', syncLabels); }
document.getElementById('saveBtn').addEventListener('click', () => {
  syncLabels();
  lsSet(LS_KEY, JSON.stringify(P));
  calcEl.textContent += ' — αποθηκεύτηκε ✓';
});
document.getElementById('resetBtn').addEventListener('click', () => {
  P = { ...HARD_DEF };
  lsDel(LS_KEY);
  syncFromP();
});

syncFromP();
reset();
// καθαρή έκδοση για itch: μόνο καμβάς, φαίνεται όλο στα 900x300
if (!/[?&]dev=1/.test(location.search + location.hash)) {
  document.getElementById('hudWrap').style.display = 'none';
  document.getElementById('dev').style.display = 'none';
  document.getElementById('title').style.display = 'none';
  document.getElementById('sub').style.display = 'none';
  document.body.style.padding = '0';
  document.body.style.minHeight = 'auto';
  document.getElementById('wrap').style.border = 'none';
  document.getElementById('wrap').style.borderRadius = '0';
}
requestAnimationFrame(loop);
</script>
</body>
